<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <style>
        body {
            padding: 20px;
            font-family: sans-serif;
            background: #1F1F1F;
            color: white;
        }
        select {
            padding: 6px;
            font-size: 16px;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            margin-top: 0;
        }
        label,
        p {
            color: #cccccc;
        }
        #site-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }
        .site-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        .site-item input {
            flex-grow: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .site-item button {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .site-item button:hover {
            background: #c82333;
        }
        #add-site-btn {
            padding: 6px 28px;
            box-sizing: border-box;
            height: 31px;
            min-width: 96px;
            background: black;
            color: white;
            border: 1px solid white;
            border-radius: 0;
            cursor: pointer;
            font-size: 14px;
            line-height: 17px;
            appearance: none;
        }
        #add-site-btn:hover {
            background: black;
        }
        #new-site-input {
            padding: 6px;
            box-sizing: border-box;
            height: 31px;
            font-size: 14px;
            line-height: 17px;
            background: #2A2A2A;
            color: white;
            border: 1px solid white;
            border-radius: 0;
            margin-right: 8px;
            width: 200px;
        }
        #startup-home-url-input {
            padding: 6px;
            background: #2A2A2A;
            color: white;
            border: 1px solid white;
            border-radius: 0;
            width: 320px;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="section">
    <h2>搜尋引擎設定</h2>
    <label>選擇預設搜尋引擎</label>
    <select id="engine-select">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="duck">DuckDuckGo</option>
    </select>
    </div>

    <div class="section">
        <h2>網站搜尋清單</h2>
        <p>新增常用網站網域，搜尋時可快速限制在指定網站內查找。</p>
        <ul id="site-list"></ul>
        <div>
            <input type="text" id="new-site-input" placeholder="輸入網址，如 wikipedia.org" />
            <button id="add-site-btn">新增</button>
        </div>
    </div>

    <div class="section">
        <h2>側邊欄設定</h2>
        <label>選擇側邊欄顯示位置</label>
        <select id="sidebar-position-select">
            <option value="left">左側</option>
            <option value="right">右側</option>
        </select>
    </div>

    <div class="section">
        <h2>首頁網址設定</h2>
        <p>設定啟動瀏覽器與按下首頁按鈕時開啟的網址。留空則使用預設首頁。</p>
        <input type="text" id="startup-home-url-input" placeholder="例如：https://example.com" />
    </div>

    <script src="./settings.js"></script>
</body>
</html>
