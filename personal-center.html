<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>個人中心</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: sans-serif;
            background: #1a1a1a;
            color: #e8e8e8;
        }
        .pc-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            gap: 0;
            padding: 0 16px;
            background: #0d0d0d;
            border-bottom: 1px solid #333;
        }
        .pc-tab {
            appearance: none;
            border: none;
            background: transparent;
            color: #888;
            padding: 16px 20px;
            font-size: 15px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pc-tab:hover { color: #ccc; }
        .pc-tab.active {
            color: #fff;
            border-bottom-color: #4a9eff;
        }
        .pc-tab .material-symbols-outlined {
            font-size: 22px;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-tab.active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-panels { padding: 20px 16px 40px; max-width: 1200px; margin: 0 auto; }
        .pc-panel { display: none; }
        .pc-panel.active { display: block; }
        .pc-empty {
            text-align: center;
            color: #666;
            padding: 48px 16px;
            font-size: 15px;
        }
        .pc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            align-items: start;
        }
        /* 僅歷史紀錄網格：卡片與欄寬約為原本的 80% */
        .pc-history-grid {
            grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
            gap: 13px;
        }
        .pc-history-grid .pc-card {
            border-radius: 6px;
        }
        .pc-history-grid .pc-card:hover {
            transform: translateY(-2px);
        }
        .pc-history-grid .pc-delete-btn {
            top: 5px;
            right: 5px;
            width: 22px;
            height: 22px;
        }
        .pc-history-grid .pc-delete-btn .material-symbols-outlined {
            font-size: 14px;
        }
        .pc-history-grid .pc-thumb.placeholder {
            padding: 19px;
        }
        .pc-history-grid .pc-card-body {
            padding: 8px 10px 10px;
        }
        .pc-history-grid .pc-title {
            font-size: 11px;
        }
        .pc-history-grid .pc-url {
            margin-top: 5px;
            font-size: 10px;
        }
        .pc-history-grid .pc-time {
            margin-top: 5px;
            font-size: 9px;
        }
        .pc-card {
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.15s;
        }
        .pc-card:hover {
            border-color: #4a9eff;
            transform: translateY(-2px);
        }
        .pc-thumb-wrap {
            aspect-ratio: 16 / 10;
            background: #111;
            position: relative;
        }
        .pc-delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 3;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 0;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pc-delete-btn:hover {
            background: rgba(180, 40, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .pc-delete-btn .material-symbols-outlined {
            font-size: 18px;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }
        .pc-thumb.placeholder {
            object-fit: contain;
            padding: 24px;
            opacity: 0.35;
        }
        .pc-card-body { padding: 10px 12px 12px; }
        .pc-title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f0f0;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pc-url {
            margin-top: 6px;
            font-size: 12px;
            color: #888;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pc-time {
            margin-top: 6px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>
    <header class="pc-header">
        <button type="button" class="pc-tab active" id="tab-history" data-panel="panel-history">
            <span class="material-symbols-outlined">history</span>
            歷史紀錄
        </button>
        <button type="button" class="pc-tab" id="tab-bookmarks" data-panel="panel-bookmarks">
            <span class="material-symbols-outlined">bookmark</span>
            書籤
        </button>
    </header>

    <div class="pc-panels">
        <section class="pc-panel active" id="panel-history" aria-label="歷史紀錄">
            <div id="history-grid" class="pc-grid pc-history-grid"></div>
            <div id="history-empty" class="pc-empty" style="display: none;">尚無造訪紀錄</div>
        </section>
        <section class="pc-panel" id="panel-bookmarks" aria-label="書籤">
            <div id="bookmarks-grid" class="pc-grid"></div>
            <div id="bookmarks-empty" class="pc-empty" style="display: none;">尚無釘選書籤（可在分頁列釘選分頁）</div>
        </section>
    </div>

    <script>
        (function () {
            const historyGrid = document.getElementById('history-grid');
            const historyEmpty = document.getElementById('history-empty');
            const bookmarksGrid = document.getElementById('bookmarks-grid');
            const bookmarksEmpty = document.getElementById('bookmarks-empty');
            const tabHistory = document.getElementById('tab-history');
            const tabBookmarks = document.getElementById('tab-bookmarks');
            const panelHistory = document.getElementById('panel-history');
            const panelBookmarks = document.getElementById('panel-bookmarks');

            function openUrl(url) {
                if (!url || url.startsWith('javascript:')) return;
                if (window.MiniBrowserAPI && typeof MiniBrowserAPI.navigateToUrl === 'function') {
                    MiniBrowserAPI.navigateToUrl(url);
                }
            }

            function formatTime(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                if (Number.isNaN(d.getTime())) return iso;
                return d.toLocaleString();
            }

            function renderHistory(entries) {
                historyGrid.innerHTML = '';
                if (!entries || entries.length === 0) {
                    historyEmpty.style.display = 'block';
                    return;
                }
                historyEmpty.style.display = 'none';
                entries.forEach(function (entry) {
                    const card = document.createElement('article');
                    card.className = 'pc-card';
                    card.tabIndex = 0;

                    const thumbWrap = document.createElement('div');
                    thumbWrap.className = 'pc-thumb-wrap';

                    const deleteBtn = document.createElement('button');
                    deleteBtn.type = 'button';
                    deleteBtn.className = 'pc-delete-btn';
                    deleteBtn.title = '刪除';
                    deleteBtn.innerHTML = '<span class="material-symbols-outlined">close</span>';
                    deleteBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        e.preventDefault();
                        if (window.MiniBrowserAPI && typeof MiniBrowserAPI.deleteHistoryEntry === 'function') {
                            MiniBrowserAPI.deleteHistoryEntry({
                                url: entry.url,
                                timestamp: entry.timestamp,
                                tabId: entry.tabId != null ? entry.tabId : null
                            });
                        }
                    });

                    const img = document.createElement('img');
                    img.className = 'pc-thumb';
                    img.alt = '';
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    if (entry.thumbnail) {
                        img.src = entry.thumbnail;
                    } else if (entry.favicon) {
                        img.src = entry.favicon;
                        img.classList.add('placeholder');
                        img.referrerPolicy = 'no-referrer';
                    } else {
                        img.src = 'data:image/svg+xml,' + encodeURIComponent(
                            '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="%23444"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'
                        );
                        img.classList.add('placeholder');
                    }
                    img.onerror = function () {
                        this.onerror = null;
                        this.src = 'data:image/svg+xml,' + encodeURIComponent(
                            '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="%23444"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'
                        );
                        this.classList.add('placeholder');
                    };

                    thumbWrap.appendChild(img);
                    thumbWrap.appendChild(deleteBtn);

                    const body = document.createElement('div');
                    body.className = 'pc-card-body';
                    const title = document.createElement('div');
                    title.className = 'pc-title';
                    title.textContent = entry.title || entry.url || '無標題';
                    const urlEl = document.createElement('div');
                    urlEl.className = 'pc-url';
                    urlEl.textContent = entry.url || '';
                    const timeEl = document.createElement('div');
                    timeEl.className = 'pc-time';
                    timeEl.textContent = formatTime(entry.timestamp);

                    body.appendChild(title);
                    body.appendChild(urlEl);
                    body.appendChild(timeEl);

                    card.appendChild(thumbWrap);
                    card.appendChild(body);

                    function go() {
                        openUrl(entry.url);
                    }
                    card.addEventListener('click', function (e) {
                        if (e.target.closest('.pc-delete-btn')) return;
                        go();
                    });
                    card.addEventListener('keydown', function (e) {
                        if (e.target !== card) return;
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            go();
                        }
                    });

                    historyGrid.appendChild(card);
                });
            }

            function renderBookmarks(list) {
                bookmarksGrid.innerHTML = '';
                if (!list || list.length === 0) {
                    bookmarksEmpty.style.display = 'block';
                    return;
                }
                bookmarksEmpty.style.display = 'none';
                list.forEach(function (item) {
                    const card = document.createElement('article');
                    card.className = 'pc-card';
                    card.setAttribute('role', 'button');
                    card.tabIndex = 0;

                    const thumbWrap = document.createElement('div');
                    thumbWrap.className = 'pc-thumb-wrap';
                    const img = document.createElement('img');
                    img.className = 'pc-thumb placeholder';
                    img.alt = '';
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.src = 'data:image/svg+xml,' + encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="%234a9eff"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>'
                    );
                    thumbWrap.appendChild(img);

                    const body = document.createElement('div');
                    body.className = 'pc-card-body';
                    const title = document.createElement('div');
                    title.className = 'pc-title';
                    title.textContent = item.title || item.url;
                    const urlEl = document.createElement('div');
                    urlEl.className = 'pc-url';
                    urlEl.textContent = item.url;

                    body.appendChild(title);
                    body.appendChild(urlEl);
                    card.appendChild(thumbWrap);
                    card.appendChild(body);

                    function go() {
                        openUrl(item.url);
                    }
                    card.addEventListener('click', go);
                    card.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            go();
                        }
                    });

                    bookmarksGrid.appendChild(card);
                });
            }

            window.personalCenter = {
                setHistory: renderHistory,
                setBookmarks: renderBookmarks
            };

            function switchPanel(panelId) {
                const isHistory = panelId === 'panel-history';
                tabHistory.classList.toggle('active', isHistory);
                tabBookmarks.classList.toggle('active', !isHistory);
                panelHistory.classList.toggle('active', isHistory);
                panelBookmarks.classList.toggle('active', !isHistory);

                if (window.MiniBrowserAPI && typeof MiniBrowserAPI.refreshPersonalCenter === 'function') {
                    MiniBrowserAPI.refreshPersonalCenter();
                }
            }

            tabHistory.addEventListener('click', function () {
                switchPanel('panel-history');
            });
            tabBookmarks.addEventListener('click', function () {
                switchPanel('panel-bookmarks');
            });

            if (window.MiniBrowserAPI && typeof MiniBrowserAPI.refreshPersonalCenter === 'function') {
                MiniBrowserAPI.refreshPersonalCenter();
            }
        })();
    </script>
</body>
</html>
