<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=calendar_view_month,lists" />
    <title>個人中心</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: sans-serif;
            background: #1a1a1a;
            color: #e8e8e8;
        }
        .pc-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            gap: 0;
            padding: 0 16px;
            background: #0d0d0d;
            border-bottom: 1px solid #333;
        }
        .pc-tab {
            appearance: none;
            border: none;
            background: transparent;
            color: #888;
            padding: 16px 20px;
            font-size: 15px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pc-tab:hover { color: #ccc; }
        .pc-tab.active {
            color: #fff;
            border-bottom-color: #4a9eff;
        }
        .pc-tab .material-symbols-outlined {
            font-size: 22px;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-tab.active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-sortbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 16px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .pc-sort-spacer {
            flex: 1;
            min-width: 12px;
        }
        .pc-sort-btn {
            appearance: none;
            border: 1px solid #3a3a3a;
            background: #252525;
            color: #e8e8e8;
            min-height: 34px;
            padding: 0 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .pc-sort-btn:hover {
            border-color: #4a9eff;
            background: #2d2d2d;
        }
        .pc-sort-btn .material-symbols-outlined {
            font-size: 19px;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-sort-btn .material-symbols-sharp {
            font-size: 19px;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-sort-btn .material-symbols-sharp.list-icon {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-panels { padding: 20px 16px 40px; max-width: 1200px; margin: 0 auto; }
        .pc-panel { display: none; }
        .pc-panel.active { display: block; }
        .pc-empty {
            text-align: center;
            color: #666;
            padding: 48px 16px;
            font-size: 15px;
        }
        .pc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            align-items: start;
        }
        /* 僅歷史紀錄網格：卡片與欄寬約為原本的 80% */
        .pc-history-grid {
            grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
            gap: 13px;
        }
        .pc-history-grid .pc-card {
            border-radius: 6px;
        }
        .pc-history-grid .pc-card:hover {
            transform: translateY(-2px);
        }
        .pc-history-grid .pc-delete-btn {
            top: 5px;
            right: 5px;
            width: 22px;
            height: 22px;
        }
        .pc-history-grid .pc-delete-btn .material-symbols-outlined {
            font-size: 14px;
        }
        .pc-history-grid .pc-thumb.placeholder {
            padding: 19px;
        }
        .pc-history-grid .pc-card-body {
            padding: 8px 10px 10px;
        }
        .pc-history-grid .pc-title {
            font-size: 11px;
        }
        .pc-history-grid .pc-url {
            margin-top: 5px;
            font-size: 10px;
        }
        .pc-history-grid .pc-time {
            margin-top: 5px;
            font-size: 9px;
        }
        .pc-history-grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .pc-history-grid.list-view .pc-card {
            display: grid;
            grid-template-columns: 82px minmax(0, 1fr);
            min-height: 56px;
            width: 100%;
        }
        .pc-history-grid.list-view .pc-card:hover {
            transform: none;
        }
        .pc-history-grid.list-view .pc-thumb-wrap {
            aspect-ratio: auto;
            min-height: 56px;
        }
        .pc-history-grid.list-view .pc-thumb.placeholder {
            padding: 14px;
        }
        .pc-history-grid.list-view .pc-card-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas:
                "title time"
                "url time";
            column-gap: 16px;
            align-items: center;
            padding: 7px 12px;
            min-width: 0;
        }
        .pc-history-grid.list-view .pc-title {
            grid-area: title;
            font-size: 13px;
            -webkit-line-clamp: 1;
        }
        .pc-history-grid.list-view .pc-url {
            grid-area: url;
            margin-top: 2px;
            font-size: 11px;
            -webkit-line-clamp: 1;
        }
        .pc-history-grid.list-view .pc-time {
            grid-area: time;
            margin-top: 0;
            font-size: 10px;
            white-space: nowrap;
            justify-self: end;
        }
        .pc-bookmark-list.list-view {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .pc-bookmark-list.list-view .pc-card {
            display: grid;
            grid-template-columns: 82px minmax(0, 1fr);
            min-height: 56px;
            width: 100%;
        }
        .pc-bookmark-list.list-view .pc-card:hover {
            transform: none;
        }
        .pc-bookmark-list.list-view .pc-thumb-wrap {
            aspect-ratio: auto;
            min-height: 56px;
        }
        .pc-bookmark-list.list-view .pc-thumb.placeholder {
            padding: 14px;
        }
        .pc-bookmark-list.list-view .pc-card-body {
            padding: 7px 12px;
            min-width: 0;
        }
        .pc-bookmark-list.list-view .pc-title {
            font-size: 13px;
            -webkit-line-clamp: 1;
        }
        .pc-bookmark-list.list-view .pc-url {
            margin-top: 2px;
            font-size: 11px;
            -webkit-line-clamp: 1;
        }
        .pc-bookmark-list.list-view .pc-delete-btn {
            top: 5px;
            right: 5px;
            width: 22px;
            height: 22px;
        }
        .pc-bookmark-list.list-view .pc-delete-btn .material-symbols-outlined {
            font-size: 14px;
        }
        .pc-card {
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.15s;
        }
        .pc-card:hover {
            border-color: #4a9eff;
            transform: translateY(-2px);
        }
        .pc-thumb-wrap {
            aspect-ratio: 16 / 10;
            background: #111;
            position: relative;
        }
        .pc-delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 3;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 0;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pc-delete-btn:hover {
            background: rgba(180, 40, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .pc-delete-btn .material-symbols-outlined {
            font-size: 18px;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pc-bookmarks-sections {
            display: block;
        }
        .pc-bookmark-section + .pc-bookmark-section {
            border-top: 1px solid #3a3a3a;
            margin-top: 22px;
            padding-top: 22px;
        }
        .pc-bookmark-heading {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 600;
            color: #f0f0f0;
        }
        .pc-bookmark-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            align-items: start;
        }
        .pc-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }
        .pc-thumb.placeholder {
            object-fit: contain;
            padding: 24px;
            opacity: 0.35;
        }
        .pc-card-body { padding: 10px 12px 12px; }
        .pc-title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f0f0;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pc-title-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            min-width: 0;
        }
        .pc-title-favicon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            object-fit: contain;
            margin-top: 1px;
        }
        .pc-title-row .pc-title {
            flex: 1;
            min-width: 0;
        }
        .pc-url {
            margin-top: 6px;
            font-size: 12px;
            color: #888;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pc-time {
            margin-top: 6px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>
    <header class="pc-header">
        <button type="button" class="pc-tab active" id="tab-history" data-panel="panel-history">
            <span class="material-symbols-outlined">history</span>
            歷史紀錄
        </button>
        <button type="button" class="pc-tab" id="tab-bookmarks" data-panel="panel-bookmarks">
            <span class="material-symbols-outlined">bookmark</span>
            書籤
        </button>
    </header>

    <div class="pc-sortbar" id="history-sortbar">
        <button type="button" class="pc-sort-btn" id="history-sort-mode" title="切換排序方式">
            <span class="material-symbols-outlined">sort</span>
            <span id="history-sort-mode-text">時間</span>
        </button>
        <button type="button" class="pc-sort-btn" id="history-sort-order" title="切換排序順序">
            <span class="material-symbols-outlined">swap_vert</span>
            <span id="history-sort-order-text">新到舊</span>
        </button>
        <div class="pc-sort-spacer"></div>
        <button type="button" class="pc-sort-btn" id="history-view-mode" title="切換外觀">
            <span class="material-symbols-sharp" id="history-view-mode-icon">calendar_view_month</span>
            <span id="history-view-mode-text">方塊</span>
        </button>
    </div>

    <div class="pc-sortbar" id="bookmarks-viewbar" style="display: none;">
        <div class="pc-sort-spacer"></div>
        <button type="button" class="pc-sort-btn" id="bookmarks-view-mode" title="切換外觀">
            <span class="material-symbols-sharp" id="bookmarks-view-mode-icon">calendar_view_month</span>
            <span id="bookmarks-view-mode-text">方塊</span>
        </button>
    </div>

    <div class="pc-panels">
        <section class="pc-panel active" id="panel-history" aria-label="歷史紀錄">
            <div id="history-grid" class="pc-grid pc-history-grid"></div>
            <div id="history-empty" class="pc-empty" style="display: none;">尚無造訪紀錄</div>
        </section>
        <section class="pc-panel" id="panel-bookmarks" aria-label="書籤">
            <div id="bookmarks-grid" class="pc-grid"></div>
            <div id="bookmarks-empty" class="pc-empty" style="display: none;">尚無書籤、釘選網址或釘選頁面</div>
        </section>
    </div>

    <script>
        (function () {
            const historyGrid = document.getElementById('history-grid');
            const historyEmpty = document.getElementById('history-empty');
            const bookmarksGrid = document.getElementById('bookmarks-grid');
            const bookmarksEmpty = document.getElementById('bookmarks-empty');
            const tabHistory = document.getElementById('tab-history');
            const tabBookmarks = document.getElementById('tab-bookmarks');
            const panelHistory = document.getElementById('panel-history');
            const panelBookmarks = document.getElementById('panel-bookmarks');
            const historySortbar = document.getElementById('history-sortbar');
            const bookmarksViewbar = document.getElementById('bookmarks-viewbar');
            const historySortModeBtn = document.getElementById('history-sort-mode');
            const historySortOrderBtn = document.getElementById('history-sort-order');
            const historyViewModeBtn = document.getElementById('history-view-mode');
            const bookmarksViewModeBtn = document.getElementById('bookmarks-view-mode');
            const historySortModeText = document.getElementById('history-sort-mode-text');
            const historySortOrderText = document.getElementById('history-sort-order-text');
            const historyViewModeIcon = document.getElementById('history-view-mode-icon');
            const historyViewModeText = document.getElementById('history-view-mode-text');
            const bookmarksViewModeIcon = document.getElementById('bookmarks-view-mode-icon');
            const bookmarksViewModeText = document.getElementById('bookmarks-view-mode-text');
            const SELECTED_PANEL_KEY = 'personal-center-selected-panel';
            const HISTORY_SORT_KEY = 'personal-center-history-sort';
            const HISTORY_VIEW_KEY = 'personal-center-history-view';
            const BOOKMARKS_VIEW_KEY = 'personal-center-bookmarks-view';
            const HISTORY_SORT_MODES = ['time', 'title', 'visits'];
            const HISTORY_SORT_LABELS = {
                time: { mode: '時間', asc: '舊到新', desc: '新到舊' },
                title: { mode: 'Title', asc: 'A-Z', desc: 'Z-A' },
                visits: { mode: '瀏覽次數', asc: '少到多', desc: '多到少' }
            };
            const HISTORY_SORT_DEFAULT_ORDER = {
                time: 'desc',
                title: 'asc',
                visits: 'desc'
            };
            let currentHistoryEntries = [];
            let historySortState = loadHistorySortState();
            let historyViewMode = loadHistoryViewMode();
            let bookmarksViewMode = loadBookmarksViewMode();

            function openUrl(url) {
                if (!url || url.startsWith('javascript:')) return;
                if (window.MiniBrowserAPI && typeof MiniBrowserAPI.navigateToUrl === 'function') {
                    MiniBrowserAPI.navigateToUrl(url);
                }
            }

            function formatTime(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                if (Number.isNaN(d.getTime())) return iso;
                return d.toLocaleString();
            }

            function loadHistorySortState() {
                try {
                    const saved = JSON.parse(localStorage.getItem(HISTORY_SORT_KEY) || '{}');
                    const mode = HISTORY_SORT_MODES.includes(saved.mode) ? saved.mode : 'time';
                    const order = saved.order === 'asc' || saved.order === 'desc'
                        ? saved.order
                        : HISTORY_SORT_DEFAULT_ORDER[mode];
                    return { mode, order };
                } catch (err) {
                    return { mode: 'time', order: 'desc' };
                }
            }

            function saveHistorySortState() {
                localStorage.setItem(HISTORY_SORT_KEY, JSON.stringify(historySortState));
            }

            function loadHistoryViewMode() {
                return localStorage.getItem(HISTORY_VIEW_KEY) === 'list' ? 'list' : 'grid';
            }

            function saveHistoryViewMode() {
                localStorage.setItem(HISTORY_VIEW_KEY, historyViewMode);
            }

            function loadBookmarksViewMode() {
                return localStorage.getItem(BOOKMARKS_VIEW_KEY) === 'list' ? 'list' : 'grid';
            }

            function saveBookmarksViewMode() {
                localStorage.setItem(BOOKMARKS_VIEW_KEY, bookmarksViewMode);
            }

            function getFallbackFaviconUrl(url) {
                try {
                    return new URL(url).origin + '/favicon.ico';
                } catch (err) {
                    return '';
                }
            }

            function createTitleRow(titleText, url, favicon) {
                const titleRow = document.createElement('div');
                titleRow.className = 'pc-title-row';

                const faviconImg = document.createElement('img');
                faviconImg.className = 'pc-title-favicon';
                faviconImg.alt = '';
                faviconImg.loading = 'lazy';
                faviconImg.decoding = 'async';
                faviconImg.referrerPolicy = 'no-referrer';
                faviconImg.src = favicon || getFallbackFaviconUrl(url);
                faviconImg.onerror = function () {
                    this.style.display = 'none';
                };

                const title = document.createElement('div');
                title.className = 'pc-title';
                title.textContent = titleText || url || '無標題';

                titleRow.appendChild(faviconImg);
                titleRow.appendChild(title);
                return titleRow;
            }

            function updateHistorySortButtons() {
                const labels = HISTORY_SORT_LABELS[historySortState.mode];
                historySortModeText.textContent = labels.mode;
                historySortOrderText.textContent = labels[historySortState.order];
            }

            function updateHistoryViewMode() {
                const isList = historyViewMode === 'list';
                historyGrid.classList.toggle('list-view', isList);
                historyViewModeIcon.textContent = isList ? 'lists' : 'calendar_view_month';
                historyViewModeIcon.classList.toggle('list-icon', isList);
                historyViewModeText.textContent = isList ? '清單' : '方塊';
            }

            function updateBookmarksViewMode() {
                const isList = bookmarksViewMode === 'list';
                document.querySelectorAll('.pc-bookmark-list').forEach(function (grid) {
                    grid.classList.toggle('list-view', isList);
                });
                bookmarksViewModeIcon.textContent = isList ? 'lists' : 'calendar_view_month';
                bookmarksViewModeIcon.classList.toggle('list-icon', isList);
                bookmarksViewModeText.textContent = isList ? '清單' : '方塊';
            }

            function getHistorySortValue(entry) {
                if (historySortState.mode === 'title') {
                    return (entry.title || entry.url || '').trim();
                }
                if (historySortState.mode === 'visits') {
                    return Number(entry.visitCount) || 0;
                }
                const time = new Date(entry.timestamp).getTime();
                return Number.isNaN(time) ? 0 : time;
            }

            function sortHistoryEntries(entries) {
                const direction = historySortState.order === 'asc' ? 1 : -1;
                return (entries || []).slice().sort(function (a, b) {
                    const av = getHistorySortValue(a);
                    const bv = getHistorySortValue(b);
                    let result = 0;
                    if (historySortState.mode === 'title') {
                        result = String(av).localeCompare(String(bv), undefined, { sensitivity: 'base' });
                    } else {
                        result = av - bv;
                    }
                    if (result === 0) {
                        const at = new Date(a.timestamp).getTime() || 0;
                        const bt = new Date(b.timestamp).getTime() || 0;
                        return bt - at;
                    }
                    return result * direction;
                });
            }

            function drawHistory(entries) {
                historyGrid.innerHTML = '';
                if (!entries || entries.length === 0) {
                    historyEmpty.style.display = 'block';
                    return;
                }
                historyEmpty.style.display = 'none';
                entries.forEach(function (entry) {
                    const card = document.createElement('article');
                    card.className = 'pc-card';
                    card.tabIndex = 0;

                    const thumbWrap = document.createElement('div');
                    thumbWrap.className = 'pc-thumb-wrap';

                    const deleteBtn = document.createElement('button');
                    deleteBtn.type = 'button';
                    deleteBtn.className = 'pc-delete-btn';
                    deleteBtn.title = '刪除';
                    deleteBtn.innerHTML = '<span class="material-symbols-outlined">close</span>';
                    deleteBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        e.preventDefault();
                        if (window.MiniBrowserAPI && typeof MiniBrowserAPI.deleteHistoryEntry === 'function') {
                            MiniBrowserAPI.deleteHistoryEntry({
                                url: entry.url,
                                timestamp: entry.timestamp,
                                tabId: entry.tabId != null ? entry.tabId : null
                            });
                        }
                    });

                    const img = document.createElement('img');
                    img.className = 'pc-thumb';
                    img.alt = '';
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    if (entry.thumbnail) {
                        img.src = entry.thumbnail;
                    } else if (entry.favicon) {
                        img.src = entry.favicon;
                        img.classList.add('placeholder');
                        img.referrerPolicy = 'no-referrer';
                    } else {
                        img.src = 'data:image/svg+xml,' + encodeURIComponent(
                            '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="%23444"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'
                        );
                        img.classList.add('placeholder');
                    }
                    img.onerror = function () {
                        this.onerror = null;
                        this.src = 'data:image/svg+xml,' + encodeURIComponent(
                            '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="%23444"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'
                        );
                        this.classList.add('placeholder');
                    };

                    thumbWrap.appendChild(img);
                    thumbWrap.appendChild(deleteBtn);

                    const body = document.createElement('div');
                    body.className = 'pc-card-body';
                    const titleRow = createTitleRow(entry.title || entry.url || '無標題', entry.url, entry.favicon);
                    const urlEl = document.createElement('div');
                    urlEl.className = 'pc-url';
                    urlEl.textContent = entry.url || '';
                    const timeEl = document.createElement('div');
                    timeEl.className = 'pc-time';
                    timeEl.textContent = formatTime(entry.timestamp);

                    body.appendChild(titleRow);
                    body.appendChild(urlEl);
                    body.appendChild(timeEl);

                    card.appendChild(thumbWrap);
                    card.appendChild(body);

                    function go() {
                        openUrl(entry.url);
                    }
                    card.addEventListener('click', function (e) {
                        if (e.target.closest('.pc-delete-btn')) return;
                        go();
                    });
                    card.addEventListener('keydown', function (e) {
                        if (e.target !== card) return;
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            go();
                        }
                    });

                    historyGrid.appendChild(card);
                });
            }

            function renderHistory(entries) {
                currentHistoryEntries = Array.isArray(entries) ? entries.slice() : [];
                updateHistorySortButtons();
                updateHistoryViewMode();
                drawHistory(sortHistoryEntries(currentHistoryEntries));
            }

            function createBookmarkCard(item, type) {
                const card = document.createElement('article');
                card.className = 'pc-card';
                card.setAttribute('role', 'button');
                card.tabIndex = 0;

                const thumbWrap = document.createElement('div');
                thumbWrap.className = 'pc-thumb-wrap';

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'pc-delete-btn';
                deleteBtn.title = '刪除';
                deleteBtn.innerHTML = '<span class="material-symbols-outlined">close</span>';
                deleteBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    e.preventDefault();
                    if (window.MiniBrowserAPI && typeof MiniBrowserAPI.deleteBookmark === 'function') {
                        MiniBrowserAPI.deleteBookmark({ url: item.url, type: type });
                    }
                });

                const img = document.createElement('img');
                img.className = 'pc-thumb placeholder';
                img.alt = '';
                img.loading = 'lazy';
                img.decoding = 'async';
                img.src = 'data:image/svg+xml,' + encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="%234a9eff"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>'
                );
                thumbWrap.appendChild(img);
                thumbWrap.appendChild(deleteBtn);

                const body = document.createElement('div');
                body.className = 'pc-card-body';
                const titleRow = createTitleRow(item.title || item.url, item.url, item.favicon);
                const urlEl = document.createElement('div');
                urlEl.className = 'pc-url';
                urlEl.textContent = item.url;

                body.appendChild(titleRow);
                body.appendChild(urlEl);
                card.appendChild(thumbWrap);
                card.appendChild(body);

                function go() {
                    openUrl(item.url);
                }
                card.addEventListener('click', function (e) {
                    if (e.target.closest('.pc-delete-btn')) return;
                    go();
                });
                card.addEventListener('keydown', function (e) {
                    if (e.target !== card) return;
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        go();
                    }
                });

                return card;
            }

            function appendBookmarkSection(title, items, type) {
                if (!items || items.length === 0) return;
                const section = document.createElement('section');
                section.className = 'pc-bookmark-section';

                const heading = document.createElement('h3');
                heading.className = 'pc-bookmark-heading';
                heading.textContent = title;

                const grid = document.createElement('div');
                grid.className = 'pc-bookmark-list';
                grid.classList.toggle('list-view', bookmarksViewMode === 'list');
                items.forEach(function (item) {
                    grid.appendChild(createBookmarkCard(item, type));
                });

                section.appendChild(heading);
                section.appendChild(grid);
                bookmarksGrid.appendChild(section);
            }

            function renderBookmarks(payload) {
                bookmarksGrid.innerHTML = '';
                bookmarksGrid.classList.add('pc-bookmarks-sections');

                const bookmarks = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.bookmarks) ? payload.bookmarks : []);
                const pinnedUrls = payload && Array.isArray(payload.pinnedUrls) ? payload.pinnedUrls : [];
                const pinnedTabs = payload && Array.isArray(payload.pinnedTabs) ? payload.pinnedTabs : [];
                if (bookmarks.length === 0 && pinnedUrls.length === 0 && pinnedTabs.length === 0) {
                    bookmarksEmpty.style.display = 'block';
                    updateBookmarksViewMode();
                    return;
                }
                bookmarksEmpty.style.display = 'none';
                appendBookmarkSection('書籤', bookmarks, 'bookmark');
                appendBookmarkSection('釘選網址', pinnedUrls, 'pinned-url');
                appendBookmarkSection('釘選頁面', pinnedTabs, 'pinned-tab');
                updateBookmarksViewMode();
            }

            window.personalCenter = {
                setHistory: renderHistory,
                setBookmarks: renderBookmarks
            };

            function switchPanel(panelId) {
                const isHistory = panelId === 'panel-history';
                localStorage.setItem(SELECTED_PANEL_KEY, isHistory ? 'panel-history' : 'panel-bookmarks');
                tabHistory.classList.toggle('active', isHistory);
                tabBookmarks.classList.toggle('active', !isHistory);
                panelHistory.classList.toggle('active', isHistory);
                panelBookmarks.classList.toggle('active', !isHistory);
                historySortbar.style.display = isHistory ? 'flex' : 'none';
                bookmarksViewbar.style.display = isHistory ? 'none' : 'flex';
                updateBookmarksViewMode();

                if (window.MiniBrowserAPI && typeof MiniBrowserAPI.refreshPersonalCenter === 'function') {
                    MiniBrowserAPI.refreshPersonalCenter();
                }
            }

            tabHistory.addEventListener('click', function () {
                switchPanel('panel-history');
            });
            tabBookmarks.addEventListener('click', function () {
                switchPanel('panel-bookmarks');
            });
            historySortModeBtn.addEventListener('click', function () {
                const currentIndex = HISTORY_SORT_MODES.indexOf(historySortState.mode);
                const nextMode = HISTORY_SORT_MODES[(currentIndex + 1) % HISTORY_SORT_MODES.length];
                historySortState = {
                    mode: nextMode,
                    order: HISTORY_SORT_DEFAULT_ORDER[nextMode]
                };
                saveHistorySortState();
                renderHistory(currentHistoryEntries);
            });
            historySortOrderBtn.addEventListener('click', function () {
                historySortState = {
                    mode: historySortState.mode,
                    order: historySortState.order === 'asc' ? 'desc' : 'asc'
                };
                saveHistorySortState();
                renderHistory(currentHistoryEntries);
            });
            historyViewModeBtn.addEventListener('click', function () {
                historyViewMode = historyViewMode === 'list' ? 'grid' : 'list';
                saveHistoryViewMode();
                updateHistoryViewMode();
            });
            bookmarksViewModeBtn.addEventListener('click', function () {
                bookmarksViewMode = bookmarksViewMode === 'list' ? 'grid' : 'list';
                saveBookmarksViewMode();
                updateBookmarksViewMode();
            });

            updateHistorySortButtons();
            updateHistoryViewMode();
            updateBookmarksViewMode();
            switchPanel(location.hash === '#bookmarks' || localStorage.getItem(SELECTED_PANEL_KEY) === 'panel-bookmarks' ? 'panel-bookmarks' : 'panel-history');
        })();
    </script>
</body>
</html>
